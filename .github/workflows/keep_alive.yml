name: Keep Streamlit Awake

on:
  schedule:
    # Runs every 5 minutes to keep the Streamlit instance continuously awake
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -s -I https://truedetective.streamlit.app | head -n 1